<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alper Games Klavye Oyunu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-size: calc(1.5rem + 1vw);
        }
        #game, #scoreboard {
            display: none;
        }
        #wordDisplay {
            font-size: calc(1.2rem + 0.5vw);
            margin: 20px 0;
        }
        #timer {
            font-size: calc(1rem + 0.5vw);
            color: red;
        }
        input[type="text"], button {
            font-size: calc(1rem + 0.5vw);
            padding: 10px;
            width: calc(80% - 20px);
            max-width: 300px;
        }
        #highScores {
            list-style: none;
            padding: 0;
        }
        @media (max-width: 600px) {
            #timer, #wordDisplay {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>Alper Games Klavye Oyunu</h1>
    <p>Lütfen isminizi girin:</p>
    <input type="text" id="nameInput" placeholder="İsminiz">
    <button onclick="startGame()">Başla</button>

    <div id="game">
        <p id="timer">Süre: 60</p>
        <p id="wordDisplay"></p>
        <input type="text" id="inputField" placeholder="Kelimeyi yazın">
        <p>Skor: <span id="score">0</span></p>
    </div>

    <div id="scoreboard">
        <h2>Skor Tablosu</h2>
        <ul id="highScores"></ul>
        <button onclick="restartGame()">Yeniden Oyna</button>
    </div>

    <!-- Javascript kısımlarında değişiklik yapılmadı -->
</body>
</html>
