<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Çarp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        #game, #scoreboard {
            display: none;
        }
        #questionDisplay {
            font-size: 24px;
            margin: 20px 0;
        }
        #timer {
            font-size: 20px;
            color: red;
        }
        #highScores {
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>Hızlı Çarp</h1>
    <p>Lütfen isminizi girin:</p>
    <input type="text" id="nameInput" placeholder="İsminiz">
    <button onclick="startGame()">Başla</button>

    <div id="game">
        <p id="timer">Süre: 60</p>
        <p id="questionDisplay"></p>
        <input type="number" id="inputField" placeholder="Sonucu yazın">
        <p>Skor: <span id="score">0</span></p>
    </div>

    <div id="scoreboard">
        <h2>Skor Tablosu</h2>
        <ul id="highScores"></ul>
        <button onclick="restartGame()">Yeniden Oyna</button>
    </div>

    <script>
        let score = 0;
        let timeLeft = 60;
        let correctAnswer = 0;
        let highScores = [];
        let timer;

        const questionDisplay = document.getElementById("questionDisplay");
        const inputField = document.getElementById("inputField");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const game = document.getElementById("game");
        const scoreboard = document.getElementById("scoreboard");
        const highScoresList = document.getElementById("highScores");

        function generateQuestion() {
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 * num2;
            questionDisplay.textContent = `${num1} × ${num2} = ?`;
        }

        function updateScore() {
            score += 3;
            scoreDisplay.textContent = score;
        }

        function updateHighScores(playerName) {
            highScores.push({ name: playerName, score: score });
            highScores.sort((a, b) => b.score - a.score);
            highScoresList.innerHTML = "";
            highScores.slice(0, 10).forEach((highScore, index) => {
                const li = document.createElement("li");
                li.textContent = `${index + 1}. ${highScore.name}: ${highScore.score}`;
                highScoresList.appendChild(li);
            });
        }

        function startGame() {
            playerName = document.getElementById("nameInput").value;
            if (playerName === "") {
                alert("Lütfen bir isim girin!");
                return;
            }
            game.style.display = "block";
            score = 0;
            timeLeft = 60;
            scoreDisplay.textContent = score;
            generateQuestion();
            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Süre: ${timeLeft}`;
                if (timeLeft === 0) {
                    clearInterval(timer);
                    inputField.disabled = true;
                    game.style.display = "none";
                    scoreboard.style.display = "block";
                    updateHighScores(playerName);
                }
            }, 1000);
        }

        inputField.addEventListener("input", function () {
            if (parseInt(inputField.value) === correctAnswer) {
                updateScore();
                generateQuestion();
                inputField.value = "";
            }
        });

        function restartGame() {
            inputField.disabled = false;
            inputField.value = "";
            scoreboard.style.display = "none";
            startGame();
        }
    </script>
</body>
</html>
